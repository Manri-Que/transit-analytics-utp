# Nombre de la aplicaci\u00f3n
spring.application.name=movisiniestros

# Puerto en el que correr\u00e1 el servidor web local
server.port=8081

# Conexi\u00f3n a la Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_movisiniestros?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Configuraci\u00f3n de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
